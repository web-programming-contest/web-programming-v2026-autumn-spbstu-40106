<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — вариант 39</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <form class="registration-form" method="post" aria-label="Регистрация">
        <input
          class="registration-input"
          type="text"
          name="name"
          placeholder="Имя"
          aria-label="Имя"
          autocomplete="name"
          required
        />
        <input
          class="registration-input"
          type="email"
          name="email"
          placeholder="E-mail"
          aria-label="E-mail"
          autocomplete="email"
          required
        />
        <input
          class="registration-input"
          type="tel"
          name="phone"
          placeholder="Телефон"
          aria-label="Телефон"
          autocomplete="tel"
          required
        />
        <input
          class="registration-input"
          type="password"
          name="password"
          placeholder="Пароль"
          aria-label="Пароль"
          autocomplete="new-password"
          required
        />
        <input
          class="registration-input"
          type="password"
          name="password-confirm"
          placeholder="Пароль еще раз"
          aria-label="Повтор пароля"
          autocomplete="new-password"
          required
        />
        <button class="registration-button" type="submit">Регистрация</button>
      </form>
    </main>
  </body>
</html>
