<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4 — Travel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Путешествия</h1>

      <form data-testid="entity-form" id="travel-form">
        <input type="number" name="id" placeholder="ID" required />
        <input
          type="text"
          name="travelerName"
          placeholder="Имя путешественника"
          required
        />
        <button type="submit">Добавить путешествие</button>
      </form>

      <form id="country-form">
        <input
          type="number"
          name="travelId"
          placeholder="ID путешествия"
          required
        />
        <input
          type="text"
          name="country"
          placeholder="Название страны"
          required
        />
        <button type="submit">Добавить страну</button>
      </form>

      <div data-testid="entity-list" id="entity-list"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
