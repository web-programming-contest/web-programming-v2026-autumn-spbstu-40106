<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <h1>Путешествия</h1>

      <form class="controls" data-testid="entity-form">
        <input
          id="travel-id"
          name="id"
          type="number"
          placeholder="ID путешествия"
          min="1"
          required
        />

        <input
          id="traveler-name"
          name="travelerName"
          type="text"
          placeholder="Имя путешественника"
          required
        />

        <input id="country" name="country" type="text" placeholder="Страна" />

        <button id="add-country" type="button">Добавить страну</button>
        <button id="remove-country" type="button">Удалить страну</button>
        <button id="add-travel" type="submit">Добавить путешествие</button>
        <button id="remove-travel" type="button">Удалить путешествие</button>
      </form>

      <div id="travel-list" class="travel-list" data-testid="entity-list"></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
